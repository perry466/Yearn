name: Release

# 推送 v* 标签时自动打包并发布 Release
# 用法：git tag -a v1.0.0 -m "..." && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

# 新版 GitHub 的 GITHUB_TOKEN 默认只读，不显式授权会导致创建 Release 失败
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    # 关键：Windows runner 默认用 PowerShell，而 ls -la / cp 等是 bash 语法
    # （PowerShell 的 Get-ChildItem 没有 -l、-a 参数，会直接报错退出）
    # 统一用 bash 后，本地脚本与 CI 的写法完全一致
    defaults:
      run:
        shell: bash

    env:
      # Windows runner 上 Python 的 stdout 默认用 locale 编码（cp1252 charmap），
      # 只要 print 中文就抛 UnicodeEncodeError 并直接以退出码 1 结束，
      # 日志里只剩一行「Process completed with exit code 1」，极难定位。
      # PYTHONUTF8 让整个解释器切到 UTF-8 模式，PYTHONIOENCODING 兜住管道输出。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史，生成变更摘要需要区间内的全部提交
          fetch-tags: true # 需要上一个 tag 来确定本次变更范围

      - name: 安装 Node 并构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装后端依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-build.txt

      # 这里的输出刻意全用 ASCII：诊断步骤本身不该成为新的失败点。
      # 中文交给 env 里的 PYTHONIOENCODING 保障，脚本内部另有兜底。
      - name: 环境自检
        run: |
          python --version
          python -c "import sys; print('exe:', sys.executable); print('stdout encoding:', sys.stdout.encoding)"
          pyinstaller --version

      - name: 打包绿色版
        run: pyinstaller Yearn.spec --noconfirm

      # 压缩后立刻校验：Release 步骤最常见的失败原因就是这里的路径对不上
      - name: 确认产物并压缩
        run: |
          python scripts/make_release_zip.py "${{ github.ref_name }}"
          test -f "Yearn-${{ github.ref_name }}-windows-x64.zip" \
            && echo "zip 校验通过" || { echo "zip 缺失"; exit 1; }

      # 即使后面的 Release 步骤失败，产物仍可从 Artifacts 下载排查
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Yearn-${{ github.ref_name }}
          path: Yearn-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

      # 无论成败都导出诊断信息：CI 日志在排查时不一定能看到全文，
      # 落到 artifact 里就能下载查阅（dist 到底生成了什么、有没有 exe）
      - name: 导出诊断信息
        if: always()
        run: |
          {
            echo "=== 工作目录 ==="
            pwd
            echo "=== 根目录 ==="
            ls -la
            echo "=== dist 树（两层）==="
            find dist -maxdepth 2 2>/dev/null | head -60 || echo "（无 dist）"
          } > diagnosis.txt 2>&1
          cat diagnosis.txt

      - name: 上传诊断信息
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ github.ref_name }}
          path: diagnosis.txt
          if-no-files-found: warn

      # 从 git 历史自动提炼本版本变更（依赖 conventional commit 规范）
      # 归类：✨ 新增 / 🗑️ 移除 / 🐛 修复 / ♻️ 重构 / ⚡ 优化 / 📝 文档 / 🧹 其他
      # 每次发版只需按规范写 commit message，Release 说明自动归类，无需手改模板
      - name: 生成变更摘要
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG_NAME}\$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE_DESC="（首次发布）"
            GIT_RANGE="HEAD"
          else
            RANGE_DESC="（自 ${PREV_TAG} 起）"
            GIT_RANGE="${PREV_TAG}..HEAD"
          fi

          added=""; removed=""; fixed=""; refactored=""; perf=""; docs=""; other=""

          while IFS='|' read -r subject sha; do
            [ -z "$subject" ] && continue
            prefix=$(printf '%s' "${subject%%:*}" | tr '[:upper:]' '[:lower:]')
            title="${subject#*: }"
            case "$prefix" in
              feat)
                if printf '%s' "$title" | grep -qE "移除|删除|去掉|丢弃|drop|remove|removed|delete"; then
                  removed+="- ${title}"$'\n'
                else
                  added+="- ${title}"$'\n'
                fi ;;
              fix)      fixed+="- ${title}"$'\n' ;;
              refactor) refactored+="- ${title}"$'\n' ;;
              perf)     perf+="- ${title}"$'\n' ;;
              docs)     docs+="- ${title}"$'\n' ;;
              *)        other+="- ${subject}"$'\n' ;;
            esac
          # ⚠️ 必须用 tformat 而不是 format：
          # --pretty=format: 生成的输出最后一行没有换行符，bash 的 `while read`
          # 遇到无换行结尾的最后一行时不执行循环体 —— 结果就是「最早那条提交被静默丢弃」。
          # 只有一条提交时更明显：变更摘要会整个为空。tformat 会补上尾随换行。
          done < <(git log "$GIT_RANGE" --no-merges --pretty=tformat:"%s|%h")

          {
            echo "### 📋 本版本变更 ${RANGE_DESC}"
            echo ""
            [ -n "$added" ]      && { echo "#### ✨ 新增功能"; echo "$added"; echo ""; }
            [ -n "$removed" ]    && { echo "#### 🗑️ 移除"; echo "$removed"; echo ""; }
            [ -n "$fixed" ]      && { echo "#### 🐛 问题修复"; echo "$fixed"; echo ""; }
            [ -n "$refactored" ] && { echo "#### ♻️ 重构"; echo "$refactored"; echo ""; }
            [ -n "$perf" ]       && { echo "#### ⚡ 性能优化"; echo "$perf"; echo ""; }
            [ -n "$docs" ]       && { echo "#### 📝 文档"; echo "$docs"; echo ""; }
            [ -n "$other" ]      && { echo "#### 🧹 其他"; echo "$other"; echo ""; }
          } > CHANGES_SUMMARY.md

          echo "===== 变更摘要预览 ====="; cat CHANGES_SUMMARY.md; echo "===== 结束 ====="

      - name: 生成发布说明
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ### 怎么用

          1. 下载下面的 `Yearn-${{ github.ref_name }}-windows-x64.zip`
          2. **解压**到任意位置，会得到一个 `Yearn` 文件夹
          3. 进入文件夹，双击 `Yearn.exe`，浏览器会自动打开 `http://localhost:8000`
          4. Yearn 会在右下角系统托盘常驻，关掉浏览器后服务仍在运行

          ### 文件夹里有什么

          | 文件 | 说明 |
          | --- | --- |
          | `Yearn.exe` | 启动程序，双击它 |
          | `lib/` | 运行依赖，不要删除或改名 |
          | `data/` | 你的数据与日志（birthday.db、yearn.log），首次运行自动创建 |
          | `使用说明.txt` | 离线版说明 |

          ### 注意事项

          - 备份或换电脑：整个 `Yearn` 文件夹一起拷走即可，数据在 `data/` 里
          - 想退出：右键点击右下角托盘图标 → **退出**
          - 服务在托盘常驻期间，每天 09:00 会自动检查当天生日并提醒
          - Windows 可能提示「已保护你的电脑」，点 **更多信息 → 仍要运行** 即可
            （个人项目未购买代码签名证书，属正常现象）
          - 若 8000 端口被占用，程序会自动改用 8001 等后续端口

          ### 源码运行

          想从源码启动、或想自己打包，请查看 [README_zh.md](https://github.com/perry466/Yearn/blob/main/README_zh.md)
          的「十、打包为 Windows 桌面应用」一节。
          EOF

          # 把变更摘要拼到最前面
          { cat CHANGES_SUMMARY.md; echo ""; cat RELEASE_NOTES.md; } > RELEASE_NOTES.tmp
          mv RELEASE_NOTES.tmp RELEASE_NOTES.md

      # 用 runner 自带的 gh CLI 而不是第三方 action：
      # softprops/action-gh-release 是 Node 20 action，在被强制跑在 Node 24 的 runner 上
      # 有崩溃风险；gh 是官方预装的原生二进制，不受 Node 版本影响，报错信息也更清楚
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Yearn 岁岁念 ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "Yearn-${{ github.ref_name }}-windows-x64.zip" \
            README_zh.md
