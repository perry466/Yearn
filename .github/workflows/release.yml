name: Release

# 推送 v* 标签时自动打包并发布 Release
# 用法：git tag -a v1.0.0 -m "..." && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

# 新版 GitHub 的 GITHUB_TOKEN 默认只读，不显式授权会导致创建 Release 失败
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    # 关键：Windows runner 默认用 PowerShell，而 ls -la / cp 等是 bash 语法
    # （PowerShell 的 Get-ChildItem 没有 -l、-a 参数，会直接报错退出）
    # 统一用 bash 后，本地脚本与 CI 的写法完全一致
    defaults:
      run:
        shell: bash

    env:
      # Windows runner 上 Python 的 stdout 默认用 locale 编码（cp1252 charmap），
      # 只要 print 中文就抛 UnicodeEncodeError 并直接以退出码 1 结束，
      # 日志里只剩一行「Process completed with exit code 1」，极难定位。
      # PYTHONUTF8 让整个解释器切到 UTF-8 模式，PYTHONIOENCODING 兜住管道输出。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 并构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装后端依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-build.txt

      # 这里的输出刻意全用 ASCII：诊断步骤本身不该成为新的失败点。
      # 中文交给 env 里的 PYTHONIOENCODING 保障，脚本内部另有兜底。
      - name: 环境自检
        run: |
          python --version
          python -c "import sys; print('exe:', sys.executable); print('stdout encoding:', sys.stdout.encoding)"
          pyinstaller --version

      - name: 打包绿色版
        run: pyinstaller Yearn.spec --noconfirm

      # 压缩后立刻校验：Release 步骤最常见的失败原因就是这里的路径对不上
      - name: 确认产物并压缩
        run: |
          python scripts/make_release_zip.py "${{ github.ref_name }}"
          test -f "Yearn-${{ github.ref_name }}-windows-x64.zip" \
            && echo "zip 校验通过" || { echo "zip 缺失"; exit 1; }

      # 即使后面的 Release 步骤失败，产物仍可从 Artifacts 下载排查
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Yearn-${{ github.ref_name }}
          path: Yearn-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

      # 无论成败都导出诊断信息：CI 日志在排查时不一定能看到全文，
      # 落到 artifact 里就能下载查阅（dist 到底生成了什么、有没有 exe）
      - name: 导出诊断信息
        if: always()
        run: |
          {
            echo "=== 工作目录 ==="
            pwd
            echo "=== 根目录 ==="
            ls -la
            echo "=== dist 树（两层）==="
            find dist -maxdepth 2 2>/dev/null | head -60 || echo "（无 dist）"
          } > diagnosis.txt 2>&1
          cat diagnosis.txt

      - name: 上传诊断信息
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ github.ref_name }}
          path: diagnosis.txt
          if-no-files-found: warn

      - name: 生成发布说明
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ### 🆕 新增功能

          - 🎨 **主题色切换**：6 套主色（活力橙 / 樱花粉 / 静谧蓝 / 森林绿 / 紫罗兰 / 石墨灰），运行时一键切换，组件零改动
          - 🖼 **自定义背景**：纯色 / 渐变 / 在线图片 / 本地上传（**原图直存 IndexedDB，零有损压缩**）；浅色与深色各设一套，附「模糊 + 压暗」双滑块
          - ✨ **界面不透明度滑块**：拖动让壁纸透出卡片 / 面板（毛玻璃感），输入框与分段控件保持不透明、始终清晰可读
          - 首帧防闪烁：主题在页面渲染前应用，开门即用

          > 💡 所有外观与主题改动都无需重启服务，在「设置 → 外观」里改即生效、自动保存。

          ### 怎么用

          1. 下载下面的 `Yearn-${{ github.ref_name }}-windows-x64.zip`
          2. **解压**到任意位置，会得到一个 `Yearn` 文件夹
          3. 进入文件夹，双击 `Yearn.exe`，浏览器会自动打开 `http://localhost:8000`
          4. Yearn 会在右下角系统托盘常驻，关掉浏览器后服务仍在运行

          ### 文件夹里有什么

          | 文件 | 说明 |
          | --- | --- |
          | `Yearn.exe` | 启动程序，双击它 |
          | `lib/` | 运行依赖，不要删除或改名 |
          | `data/` | 你的数据与日志（birthday.db、yearn.log），首次运行自动创建 |
          | `使用说明.txt` | 离线版说明 |

          ### 注意事项

          - 备份或换电脑：整个 `Yearn` 文件夹一起拷走即可，数据在 `data/` 里
          - 想退出：右键点击右下角托盘图标 → **退出**
          - 服务在托盘常驻期间，每天 09:00 会自动检查当天生日并提醒
          - Windows 可能提示「已保护你的电脑」，点 **更多信息 → 仍要运行** 即可
            （个人项目未购买代码签名证书，属正常现象）
          - 若 8000 端口被占用，程序会自动改用 8001 等后续端口

          ### 源码运行

          想从源码启动、或想自己打包，请查看 [README_zh.md](https://github.com/perry466/Yearn/blob/main/README_zh.md)
          的「十、打包为 Windows 桌面应用」一节。
          EOF

      # 用 runner 自带的 gh CLI 而不是第三方 action：
      # softprops/action-gh-release 是 Node 20 action，在被强制跑在 Node 24 的 runner 上
      # 有崩溃风险；gh 是官方预装的原生二进制，不受 Node 版本影响，报错信息也更清楚
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Yearn 岁岁念 ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "Yearn-${{ github.ref_name }}-windows-x64.zip" \
            README_zh.md
